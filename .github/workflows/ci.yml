name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cms:cms@localhost:5433/cms
      TEST_DATABASE_URL: postgresql://cms:cms@localhost:5433/cms_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # El build consulta la base: generateStaticParams pregunta qué páginas
      # prerenderizar. Sin esquema, falla con «relation does not exist».
      - name: Migraciones
        run: npx drizzle-kit migrate

      - name: Pruebas
        run: npm test

      - name: Build
        run: npx next build
